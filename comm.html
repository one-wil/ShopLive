<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Commande reçue par E-mail</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: #0a1a2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Conteneur principal - occupe tout l'écran */
        .fullscreen-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #0a1a2b;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Interface initiale (visible quand pas d'image) */
        .interface {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            max-width: 520px;
            width: 90%;
            padding: 2.5rem 2rem 2.5rem;
            border-radius: 50px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Quand l'image est chargée, on cache l'interface */
        .interface.hidden {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
            visibility: hidden;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #0b2b3d;
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            color: #2c5f7a;
            font-weight: 600;
            font-size: 1rem;
            background: #e3f0f7;
            display: inline-block;
            padding: 0.3rem 1.5rem;
            border-radius: 40px;
            margin-bottom: 1.8rem;
        }

        /* Zone d'aperçu */
        .image-preview {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-height: 260px;
            background: #f0f6fb;
            border-radius: 28px;
            border: 2px dashed #b6d2e3;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0 auto 1.8rem;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
        }

        .image-preview:hover {
            border-color: #2e7d9e;
            background: #e9f2f9;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .image-preview .placeholder {
            color: #5f8ba3;
            font-size: 1rem;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 10px;
        }

        .image-preview .placeholder span {
            font-size: 3rem;
            opacity: 0.6;
        }

        .upload-btn-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 1.2rem;
            width: 100%;
        }

        .upload-btn-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .btn-upload {
            background: #1f5a77;
            color: white;
            border: none;
            padding: 0.9rem 1.8rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(26, 90, 125, 0.3);
            letter-spacing: 0.3px;
        }

        .btn-upload:hover {
            background: #134a63;
            transform: scale(1.01);
            box-shadow: 0 10px 20px rgba(18, 70, 100, 0.35);
        }

        .btn-save {
            background: #0f3b4e;
            color: white;
            border: none;
            padding: 0.9rem 1.8rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(10, 50, 70, 0.25);
            margin-top: 0.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-save:hover {
            background: #082b3a;
            transform: scale(1.01);
        }

        .status-msg {
            margin-top: 1.2rem;
            font-size: 0.95rem;
            color: #1b4b62;
            background: #dcecf6;
            padding: 0.6rem 1rem;
            border-radius: 40px;
            font-weight: 500;
            display: none;
        }

        .status-msg.show {
            display: block;
        }

        .badge-email {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #2f657f;
            background: #dcecf6;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            display: inline-block;
        }

        /* ===== IMAGE PLEIN ÉCRAN ===== */
        .fullscreen-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            animation: fadeIn 0.6s ease;
        }

        .fullscreen-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-width: 100vw;
            max-height: 100vh;
        }

        .fullscreen-image.show {
            display: flex;
        }

        /* Indicateur "Cliquez pour quitter" */
        .fullscreen-image .hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 20px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            animation: pulse 2s infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .interface {
                padding: 1.8rem 1.2rem;
                border-radius: 30px;
                width: 95%;
            }
            h1 {
                font-size: 1.6rem;
            }
            .image-preview {
                max-height: 200px;
            }
        }
    </style>
</head>
<body>

<div class="fullscreen-container">

    <!-- ===== INTERFACE INITIALE ===== -->
    <div class="interface" id="mainInterface">
        <h1>📬 Commande reçue</h1>
        <div class="subtitle">par E-mail</div>

        <div class="image-preview" id="imagePreview" onclick="document.getElementById('fileInput').click();">
            <div class="placeholder" id="placeholderText">
                <span>🖼️</span>
                Cliquez pour charger une image
            </div>
            <img id="uploadedImage" src="" alt="Image de la commande" />
        </div>

        <div class="upload-btn-wrapper">
            <input type="file" id="fileInput" accept="image/*" />
            <button class="btn-upload" onclick="document.getElementById('fileInput').click();">
                ⬆ Choisir une image
            </button>
        </div>

        <button class="btn-save" id="saveBtn">
            💾 Sauvegarder l'image
        </button>

        <div id="statusMsg" class="status-msg">✅ Image sauvegardée avec succès</div>
        <div class="badge-email">✉️ commande@exemple.com</div>
    </div>

    <!-- ===== IMAGE PLEIN ÉCRAN ===== -->
    <div class="fullscreen-image" id="fullscreenImage">
        <img id="fullscreenImg" src="" alt="Image en plein écran" />
        <div class="hint">🖱️ Cliquez pour fermer</div>
    </div>

</div>

<script>
    (function() {
        // Éléments DOM
        const fileInput = document.getElementById('fileInput');
        const previewDiv = document.getElementById('imagePreview');
        const uploadedImg = document.getElementById('uploadedImage');
        const placeholderText = document.getElementById('placeholderText');
        const statusMsg = document.getElementById('statusMsg');
        const saveBtn = document.getElementById('saveBtn');
        const mainInterface = document.getElementById('mainInterface');
        const fullscreenContainer = document.getElementById('fullscreenImage');
        const fullscreenImg = document.getElementById('fullscreenImg');

        let currentImageData = null;

        // --- Charger l'image sauvegardée ---
        function loadStoredImage() {
            const stored = localStorage.getItem('savedCommandImage');
            if (stored) {
                try {
                    const testImg = new Image();
                    testImg.onload = function() {
                        currentImageData = stored;
                        uploadedImg.src = stored;
                        uploadedImg.style.display = 'block';
                        placeholderText.style.display = 'none';
                        // Afficher directement en plein écran
                        showFullscreen(stored);
                    };
                    testImg.onerror = function() {
                        localStorage.removeItem('savedCommandImage');
                        resetPreview();
                    };
                    testImg.src = stored;
                } catch (e) {
                    localStorage.removeItem('savedCommandImage');
                    resetPreview();
                }
            } else {
                resetPreview();
            }
        }

        // --- Réinitialiser l'aperçu ---
        function resetPreview() {
            currentImageData = null;
            uploadedImg.src = '';
            uploadedImg.style.display = 'none';
            placeholderText.style.display = 'flex';
            statusMsg.classList.remove('show');
            mainInterface.classList.remove('hidden');
            fullscreenContainer.classList.remove('show');
            fullscreenContainer.style.display = 'none';
        }

        // --- Afficher l'image en plein écran (cache l'interface) ---
        function showFullscreen(imageData) {
            fullscreenImg.src = imageData;
            fullscreenContainer.style.display = 'flex';
            // Petit délai pour l'animation
            requestAnimationFrame(() => {
                fullscreenContainer.classList.add('show');
            });
            mainInterface.classList.add('hidden');
        }

        // --- Cacher le plein écran et revenir à l'interface ---
        function hideFullscreen() {
            fullscreenContainer.classList.remove('show');
            setTimeout(() => {
                fullscreenContainer.style.display = 'none';
                // On remet l'interface seulement si une image est chargée
                if (currentImageData) {
                    mainInterface.classList.remove('hidden');
                }
            }, 500);
        }

        // --- Traiter une nouvelle image chargée ---
        function displayImage(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('Veuillez sélectionner une image valide.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageData = e.target.result;
                currentImageData = imageData;
                uploadedImg.src = imageData;
                uploadedImg.style.display = 'block';
                placeholderText.style.display = 'none';
                statusMsg.classList.remove('show');

                // Passer directement en plein écran
                showFullscreen(imageData);
            };
            reader.onerror = function() {
                alert('Erreur lors de la lecture de l\'image.');
            };
            reader.readAsDataURL(file);
        }

        // --- Sauvegarder l'image ---
        function saveImage() {
            if (!currentImageData) {
                statusMsg.textContent = '⚠️ Aucune image à sauvegarder.';
                statusMsg.style.background = '#fce9d6';
                statusMsg.style.color = '#8a5a2e';
                statusMsg.classList.add('show');
                setTimeout(() => {
                    statusMsg.classList.remove('show');
                    statusMsg.style.background = '#dcecf6';
                    statusMsg.style.color = '#1b4b62';
                }, 2500);
                return;
            }

            try {
                localStorage.setItem('savedCommandImage', currentImageData);
                statusMsg.textContent = '✅ Image sauvegardée avec succès !';
                statusMsg.style.background = '#d4edda';
                statusMsg.style.color = '#155724';
                statusMsg.classList.add('show');
                setTimeout(() => {
                    statusMsg.classList.remove('show');
                    statusMsg.style.background = '#dcecf6';
                    statusMsg.style.color = '#1b4b62';
                }, 3000);
            } catch (e) {
                alert('Erreur lors de la sauvegarde : ' + e.message);
            }
        }

        // --- Événements ---

        // Chargement du fichier
        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                displayImage(this.files[0]);
            }
            this.value = '';
        });

        // Sauvegarde
        saveBtn.addEventListener('click', saveImage);

        // Clic sur l'image plein écran pour revenir à l'interface
        fullscreenContainer.addEventListener('click', function(e) {
            // Ne pas fermer si on clique sur l'image elle-même (pour éviter les fermetures accidentelles)
            // Mais on veut fermer en cliquant n'importe où
            hideFullscreen();
        });

        // Glisser-déposer
        previewDiv.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.style.borderColor = '#1f5a77';
            this.style.background = '#dcecf6';
        });

        previewDiv.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.style.borderColor = '#b6d2e3';
            this.style.background = '#f0f6fb';
        });

        previewDiv.addEventListener('drop', function(e) {
            e.preventDefault();
            this.style.borderColor = '#b6d2e3';
            this.style.background = '#f0f6fb';
            const files = e.dataTransfer.files;
            if (files && files[0]) {
                displayImage(files[0]);
            }
        });

        // --- Initialisation ---
        loadStoredImage();

    })();
</script>

</body>
</html>
